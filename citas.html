    <article id="aCitas">
        <div class="container p-5 mt-5" style="background-color: #004750; color: aliceblue; border-radius: 25px;" >
            <h2 class="text-center mb-4">Registrar Cita</h2>
                    <!--Formulario Boostrap-->
                    <form class="row g-3">
  <div class="col-md-6">
    <p style="color: aqua; font-weight: bold; font-size: 20px;" class="mb-3">Datos del dueño</p>
    <div class="mb-3">
    <label for="validationDefaultNombre" class="form-label">Nombre</label>
    <input type="text" class="form-control" style="background-color: #021F23; color: aliceblue;" id="validationDefault01" value="Mark" required>
  </div>
  <div class="mb-3">
    <label for="validationDefaultUsername" class="form-label">Numero de Telefono</label>
    <div class="input-group">
      <span class="input-group-text" id="inputGroupPrepend2">+52</span>
      <input type="tel" class="form-control" style="background-color: #021F23; color: aliceblue;" id="validationDefaultUsername" aria-describedby="inputGroupPrepend2" required>
    </div>
  </div>
    <div class="mb-3">
    <label for="validationDefaultDireccion" class="form-label">Direccion</label>
    <input type="text" class="form-control" style="background-color: #021F23; color: aliceblue;" id="validationDefault01" value="Mark" required>
  </div>
  </div>
  <div class="col-md-6">
    <p style="color: aqua; font-weight: bold; font-size: 20px;"class="mb-3">Datos de la mascota</p>
    <div class="mb-3">
    <label for="validationDefaultNombre" class="form-label">Nombre</label>
    <input type="text" class="form-control" style="background-color: #021F23; color: aliceblue;" id="validationDefault02" value="Otto" required>
  </div>
  <div class="mb-3">
    <label for="validationDefault0Peso" class="form-label">Peso Kg</label>
    <input type="text" class="form-control" style="background-color: #021F23; color: aliceblue;" id="validationDefault01" value="Mark" required>
  </div>
  <div class="row mb-3">
  <div class="col-md-4 d-inline-block">
    <label for="validationDefaultEdad" class="form-label">Edad</label>
    <select class="form-select" style="background-color: #021F23; color: aliceblue;" id="validationDefault04" required>
      <option selected disabled value="">Choose...</option>
      <option>...</option>
    </select>
  </div>
  <div class="col-md-4 gap-3">
    <label for="validationDefault0Especie" class="form-label">Especie</label>
    <select class="form-select" style="background-color: #021F23; color: aliceblue;" id="validationDefault04" required>
      <option selected disabled value="">Choose...</option>
      <option>...</option>
    </select>
  </div>
  <div class="col-md-4 gap-2">
  <p>Alergias</p>
  <div class="form-check">
  <input class="form-check-input" type="radio" name="radioDefault" id="radioDefault1">
  <label class="form-check-label" for="radioDefault1">
    Si
  </label>
</div>
<div class="col-md-4 gap-2">
<div class="form-check">
  <input class="form-check-input" type="radio" name="radioDefault" id="radioDefault2" checked>
  <label class="form-check-label" for="radioDefault2">
    No
  </label>
</div>
  </div>
   </div>
   </div>
  </div>
   <div class="col-md-12">
    <p style="color: aqua; font-weight: bold; font-size: 20px;"class="mb-3">Datos de la cita</p>
    <div class="col-md-4 gap-3">
    <label for="validationDefaultServicio" class="form-label">Servivio</label>
    <select class="form-select" style="background-color: #021F23; color: aliceblue;" id="validationDefault04" required>
      <option selected disabled value="">Choose...</option>
      <option>...</option>
    </select>
  </div>
  <div class="col-md-5 d-inline-block">
    <label for="validationDefaultMotivo" class="form-label">Motivo</label>
    <input type="text" class="form-control" style="background-color: #021F23; color: aliceblue;" id="validationDefault01" value="Mark" required>
  </div>
  <div class="col-md-3 d-inline-block">
    <label for="validationDefaultFecha" class="form-label">Fecha</label>
    <input type="date" class="form-control" style="background-color: #021F23; color: aliceblue;" id="validationDefault01" value="Mark" required>
  </div>
  <div class="col-md-3 gap-3 d-inline-block">
    <label for="validationDefaultHora" class="form-label">Hora</label>
    <select class="form-select" style="background-color: #021F23; color: aliceblue;" id="validationDefault04" required>
      <option selected disabled value="">Choose...</option>
      <option>...</option>
    </select>
  </div>
  <div class="col-md-4 gap-3 d-inline-block">
    <label for="validationDefaultConsultorio" class="form-label">Consultorio Asigando</label>
    <input type="text" class="form-control" style="background-color: #021F23; color: aliceblue;" id="validationDefault01" value="Mark" required>
  </div>
   </div>
   
  <div class="col-md-12">

    <button type="button submit" class="btn  btn-lg bg-primary pt-2 mb-2" style="color: aliceblue; font-weight: bold; border-radius: 20px;">Registrar mascota</button>
  </div>
</div>
