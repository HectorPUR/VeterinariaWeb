<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Vterinaria</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background-color: #021F23; color: aliceblue;">

    <div class="container-fluid p-0">
        <div class="row g-0 min-vh-100">
                <div class="col-md-6 p-0" >
                <img src="imagenes/inicio.png" alt="Registro" class="w-100 h-100">
            </div>
            <div class="col-md-6 align-content-center justify-content-center p-3">
                <div class="card shadow border-0" style="background-color: #021F23; color: aliceblue;">
                        <h4 style="text-align: center;">Inicio de sesion</h4>
                    <div class="card-body p-4">
                        <div class="alert alert-secondary small text-center">
                            Administrador/ Veterinario / Recepcionista / Auxiliar <br>Clave para todos: <strong>1209</strong>
                        </div>
                        <form id="formLogin">
                            <div class="mb-3">
                                <label class="form-label fw-bold">Usuario</label>
                                <select id="inputUser" class="form-select" required>
                                <option value="">Seleccione</option>
                                <option value="Administrador" id="inputUser" class="form-control" required>Administrador</option>
                                <option value="Veterinario" id="inputUser" class="form-control" required>Veterinario</option>
                                <option value="Recepcionista" id="inputUser" class="form-control" required>Recepcionista</option>
                                <option value="Auxiliar" id="inputUser" class="form-control" required>Auxiliar</option>
                                </select>
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-bold">Contraseña</label>
                                <input type="password" id="inputPass" class="form-control" required>
                            </div>
                            <p style="text-align: center; font-size: 0.9rem; color: #6c757d;">
                                ¿Haz olvidado tu contraseña?
                            </p>
                            <button type="submit" class="btn fw-bold px-5" style="background-color: chartreuse ; color: black; display: block; margin:auto;">Ingresar</button>
                            <div id="errorMsg" class="text-danger mt-3 text-center d-none">Credenciales inválidas.</div>
                        </form>
                    </div>
                </div>
            </div> 
        </div>
    </div>

    <script src="js/veterinaria.js"></script>
    <script>    
        // Si el usuario ya está logueado, lo sacamos del login
        document.addEventListener('DOMContentLoaded', saltarLoginSiAutenticado);
        
        // Conectar el formulario a la función de JS
        document.getElementById('formLogin').addEventListener('submit', iniciarSesion);
    </script>
</body>
</html>
