<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Vterinaria</title>
    <link rel="stylesheet" href="css/miEstilo4.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="login-body">

    <div class="container-fluid p-0">
        <div class="row g-0 min-vh-100">
                
            <div class="col-md-6 login-imagen" >
                <img src="imagenes/inicio.png" alt="Registro">
            </div>
            
            <div class="col-md-6 login-contenedor">
                <div class="card login-card shadow border-0">

                        <h4 class="text-center fw-bold">Inicio de sesion</h4>

                        <div class="card-body p-4">
                            <div class="alert alert-secondary small text-center">
                                Administrador/ Veterinario / Recepcionista / Auxiliar 
                                <br>Clave para todos: <strong>1209</strong>
                            </div>

                        <form id="formLogin">

                            <div class="mb-3">
                                <label class="form-label fw-bold">Usuario</label>
                                <select id="inputUser" class="form-select" required>
                                    <option value="">Seleccione</option>
                                    <option value="Administrador">Administrador</option>
                                    <option value="Veterinario">Veterinario</option>
                                    <option value="Recepcionista">Recepcionista</option>
                                    <option value="Auxiliar">Auxiliar</option>
                                </select>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-bold">Contraseña</label>
                                <input type="password" id="inputPass" class="form-control" required>
                            </div>
                            <p class="login-recuperar">
                                ¿Has olvidado tu contraseña?
                            </p>
                            <button type="submit" class="btn btn-login fw-bold px-5">Ingresar</button>
                            <div id="errorMsg" class="text-danger mt-3 text-center d-none">Credenciales inválidas.</div>
                        </form>
                    </div>
                </div>
            </div> 
        </div>
    </div>

    <script src="js/veterinaria.js"></script>
    <script>    
        // Si el usuario ya está logueado, lo sacamos del login
        document.addEventListener('DOMContentLoaded', saltarLoginSiAutenticado);
        
        // Conectar el formulario a la función de JS
        document.getElementById('formLogin').addEventListener('submit', iniciarSesion);
    </script>
</body>
</html>
